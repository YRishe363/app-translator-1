version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: translations
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: translations
      DB_USER: postgres
      DB_PASSWORD: password
    depends_on:
      - db
      - translator

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  translator:
    image: libretranslate/libretranslate
    ports:
      - "5000:5000"

volumes:
  pgdata: