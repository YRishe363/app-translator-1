name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: |
            yocheved363/translator-frontend:latest
            yocheved363/translator-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            yocheved363/translator-backend:latest
            yocheved363/translator-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-validation:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Helm Lint
        run: helm lint ./my-translator

      - name: Helm Template Test
        run: helm template my-translator ./my-translator --set backend.image.tag=${{ github.sha }}

      - name: Helm Package
        run: |
          mkdir ./pkg
          helm package ./my-translator --destination ./pkg