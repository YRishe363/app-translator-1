apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: translator-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # הסרנו את ה-rewrite-target לגמרי!
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 3001
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80