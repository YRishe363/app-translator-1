apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: yocheved363/translator-backend:latest
        env:
        - name: DB_HOST
          value: db
        - name: TRANSLATOR_URL
          value: http://translator:5000/translate
        ports:
        - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  ports:
  - port: 3001
  selector:
    app: backend